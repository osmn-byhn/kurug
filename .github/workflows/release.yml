name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            target: --linux deb rpm AppImage
            assets: |
              releases/*.deb
              releases/*.rpm
              releases/*.AppImage
              releases/latest-linux.yml
          - platform: windows
            runner: windows-2022
            target: --win nsis
            assets: |
              releases/*.exe
              releases/*.blockmap
              releases/latest.yml
          - platform: macos
            runner: macos-15-intel
            target: --mac dmg zip
            assets: |
              releases/*.dmg
              releases/*.zip
              releases/latest-mac.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libopenjp2-tools

      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Kurug $version" \
            --generate-notes
